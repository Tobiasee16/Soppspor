# Keeps the Supabase project awake through the off-season.
#
# A free-tier project pauses after 7 days with no database activity, and a
# paused project is a silent outage: restoring it is a manual click in a
# dashboard, and until someone makes it nobody can sign in or sync. This app is
# seasonal - busy August to October, quiet the rest of the year - so the pause
# would land in February and surface on the first good weekend of the next
# season, to a user who has been told their spots are safely synced.
#
# Needs two repository secrets, neither of which is sensitive:
#   SUPABASE_URL        https://<ref>.supabase.co
#   SUPABASE_ANON_KEY   the anon / publishable key, never the service_role one
#
# The anon key is already public - it ships inside the app - and row-level
# security is what protects the rows. It lives in a secret here only because
# repository secrets are the tidy place for deployment configuration.
name: keepalive

on:
  schedule:
    # Twice a week. The limit is 7 days; pinging every 3-4 leaves room for one
    # run to fail without the project pausing.
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python scripts/keepalive.py
